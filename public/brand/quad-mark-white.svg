<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 120" width="96" height="120" role="img" aria-label="QUAD mark">
  <!-- QUAD mark, vectorised from the owner's original: 4 x 5 unit grid, top bar 2u, side bars 1u wide (left 2u tall, right 1.5u), bottom bar with a 45° tail. -->
  
  <g fill="#ffffff" shape-rendering="crispEdges"><rect x="24" y="0" width="48" height="24"/><rect x="0" y="24" width="24" height="48"/><rect x="72" y="24" width="24" height="36"/><polygon points="24,72 72,72 96,96 96,120 72,96 24,96"/></g>
</svg>
